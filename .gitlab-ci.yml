# Strict code quality pipeline for the DSS UI Kit.
#
# Every job installs with `deno install --frozen`, so a job fails outright when
# package.json and deno.lock disagree, or when a dependency version was bumped
# without refreshing the lockfile. All dependency versions are pinned exactly.
#
# Locally, the same gate is `deno task ci` (or `npm run ci`).

stages:
  - verify
  - build

variables:
  # Keep in sync with `engines.deno` in package.json.
  DENO_VERSION: "2.9.6"
  # Cached inside the project directory so the image's HOME is not required.
  DENO_DIR: "$CI_PROJECT_DIR/.deno"
  # The release job reads tags and the full history to derive the version.
  GIT_DEPTH: "0"

default:
  image: "denoland/deno:$DENO_VERSION"
  interruptible: true

cache:
  key:
    files: [deno.lock, package.json]
  paths:
    - .deno
    - node_modules
  policy: pull-push

setup:
  stage: verify
  script:
    - deno --version
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - deno install --frozen
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Formatting is not negotiable: biome ci reports unformatted files as errors.
format:
  stage: verify
  needs: [setup]
  script:
    - deno task format:check
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

lint:
  stage: verify
  needs: [setup]
  script:
    - deno task lint:biome
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

typecheck:
  stage: verify
  needs: [setup]
  script:
    - deno task typecheck
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

test:
  stage: verify
  needs: [setup]
  script:
    - deno task test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Rejects a commit message that is not Conventional Commits. The local
# commit-msg hook covers day-to-day work; this keeps the rule enforced on
# history that reaches the repository by other means.
commit-message:
  stage: verify
  needs: [setup]
  script:
    - echo "Checking commit message: $CI_COMMIT_TITLE"
    - deno task commitlint --message "$CI_COMMIT_TITLE"
  rules:
    - if: $CI_COMMIT_MESSAGE
    - when: never

# A library is judged on what it hands a consumer: the bundle, the type
# declarations and the stylesheet. `deno task build` produces all three, and
# `deno task pack` proves the manifest points at files that exist — a package
# that publishes with a broken `exports` map installs and then fails at import
# time in someone else's project.
build:
  stage: build
  needs: [setup]
  script:
    - deno task build
    - deno task pack
  artifacts:
    paths: [dist/]
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v/

# The API reference is generated from the source. Building it here means it
# cannot drift from the code, and a change that breaks the public surface (a
# bad @link, an unresolvable type) fails the pipeline.
#
# TypeDoc warns rather than fails when the `origin` remote is not configured, which only affects
# the "view source" links, so this job gates on errors, not on warnings.
docs:
  stage: build
  needs: [setup]
  script:
    - deno task docs
  artifacts:
    paths: [docs/api/]
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Shows what `deno task release` would produce for the current history, without
# touching the working tree.
release-preview:
  stage: build
  needs: [setup]
  script:
    - deno task release --dry-run --skip-lint
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
