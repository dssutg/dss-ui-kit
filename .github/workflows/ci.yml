# Strict code quality pipeline for the DSS UI Kit.
#
# Every job installs with `deno install --frozen` through ./.github/actions/setup, so a job fails
# outright when package.json and deno.lock disagree, or when a dependency version was bumped without
# refreshing the lockfile. All dependency versions are pinned exactly.
#
# Every job checks the repository out before it references that local action: a local action is read
# from the working directory, so the runner has to hold the files that define it before the step
# using it can be resolved.
#
# Locally, the same gate is `deno task ci` (or `npm run ci`).

name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  # One pipeline per ref. A new push supersedes the run in flight for the same branch; a tag keeps
  # its own so a release is never cancelled by the branch commit that precedes it.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  # Keep in sync with `engines.deno` in package.json.
  DENO_VERSION: 2.9.6
  # The commit-message and release-preview jobs read history a shallow clone does not have.
  GIT_DEPTH: 0

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      # Formatting is not negotiable: `biome ci` reports unformatted files as errors.
      - run: deno task format:check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: deno task lint:biome

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: deno task typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: deno task test

  commit-message:
    name: Commit message
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      # GitHub exposes the pull request's title on the event payload, not as an environment variable.
      PR_TITLE: ${{ github.event.pull_request.title }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: ${{ env.GIT_DEPTH }}
      - uses: ./.github/actions/setup
      # Rejects a commit message that is not Conventional Commits. The local commit-msg hook covers
      # day-to-day work; this keeps the rule enforced on history that reaches the repository by
      # other means.
      - name: Check
        run: deno task commitlint --message "$PR_TITLE"

  # A library is judged on what it hands a consumer: the bundle, the type declarations and the
  # stylesheet. `deno task build` produces all three, and `deno task pack` proves the manifest points
  # at files that exist — a package that publishes with a broken `exports` map installs and then
  # fails at import time in someone else's project.
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: deno task build
      - run: deno task pack
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  # The API reference is generated from the source. Building it here means it cannot drift from the
  # code, and a change that breaks the public surface (a bad @link, an unresolvable type) fails the
  # pipeline.
  #
  # TypeDoc warns rather than fails when the `origin` remote is not configured, which only affects
  # the "view source" links, so this job gates on errors, not on warnings.
  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: deno task docs
      - uses: actions/upload-artifact@v4
        with:
          name: api-docs
          path: docs/api/
          retention-days: 7

  # Shows what `deno task release` would produce for the current history, without touching the
  # working tree.
  release-preview:
    name: Release preview
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: ${{ env.GIT_DEPTH }}
      - uses: ./.github/actions/setup
      - run: deno task release --dry-run --skip-lint
