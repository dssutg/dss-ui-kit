# Strict code quality pipeline for the DSS UI Kit.
#
# Every job installs with `deno install --frozen` through ./.github/actions/setup, so a job fails
# outright when package.json and deno.lock disagree, or when a dependency version was bumped without
# refreshing the lockfile. All dependency versions are pinned exactly.
#
# Every job checks the repository out before it references that local action: a local action is read
# from the working directory, so the runner has to hold the files that define it before the step
# using it can be resolved.
#
# Locally, the same gate is `deno task ci` (or `npm run ci`).

name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  # One pipeline per ref. A new push supersedes the run in flight for the same branch; a tag keeps
  # its own so a release is never cancelled by the branch commit that precedes it.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  # Keep in sync with `engines.deno` in package.json.
  DENO_VERSION: 2.9.7
  # The release of bump-version this pipeline installs to lint commit messages. Pinned like every
  # other tool, so a lint failure comes from the history and not from a newer checker.
  BUMP_VERSION: 2.1.1

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      # Formatting is not negotiable: `biome ci` reports unformatted files as errors.
      - run: deno task format:check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: deno task lint:biome

  # Conventional Commits is a rule the whole history is held to, and it used to live only in a local
  # `commit-msg` hook that a clone does not install. bump-version is the maintainer's own tool — the
  # same one a release runs — installed here from a pinned release, so the history is checked by the
  # tool that reads it. `fetch-depth: 0` brings the tags and the full history the lint walks; the
  # default shallow checkout has neither.
  commits:
    name: Commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Install bump-version
        run: |
          curl -fsSL -o bump-version.zip "https://github.com/dssutg/bump-version/releases/download/v${BUMP_VERSION}/linux-amd64.zip"
          unzip -o bump-version.zip -d bump-version
          install -m 0755 bump-version/linux-amd64/bump-version /usr/local/bin/bump-version
      - run: deno task lint:commits

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: deno task typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: deno task test

  # A library is judged on what it hands a consumer: the bundle, the type declarations and the
  # stylesheet. `deno task build` produces all three, and `deno task pack` proves the manifest points
  # at files that exist — a package that publishes with a broken `exports` map installs and then
  # fails at import time in someone else's project.
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: deno task build
      - run: deno task pack
      # The same version ships to JSR as source, and that reading resolves the `@/` alias, the
      # `react` alias and the shaders through a generated config. A dry publish is what proves the
      # source still loads under Deno's resolver, without contacting the registry.
      - run: deno task publish:dry
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  # The same version ships to JSR as source, so every symbol reachable from `src/index.ts` has to
  # declare its type — an inferred return type is a "slow type" the registry refuses. This runs JSR's
  # `no-slow-types` rule against the same generated config a publish would use, without uploading.
  return-types:
    name: Return types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: deno task lint:return-types

  # The API reference is generated from the source. Building it here means it cannot drift from the
  # code, and a change that breaks the public surface (a bad @link, an unresolvable type) fails the
  # pipeline.
  #
  # `treatValidationWarningsAsErrors` in typedoc.json makes a documented-but-unreachable type an
  # error. The one warning left is `origin` being unconfigured, which only affects "view source"
  # links and is not a validation warning.
  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: deno task docs
      - uses: actions/upload-artifact@v4
        with:
          name: api-docs
          path: docs/api/
          retention-days: 7
