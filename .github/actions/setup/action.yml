# Installs the pinned Deno and the dependencies from the lockfile.
#
# Every job uses this, because a GitHub job gets a fresh runner: a dependency set up in one job does
# not exist in the next. Installing here rather than in a setup job is what makes `deno install
# --frozen` real — a job that skipped it would let Deno resolve dependencies itself and would not
# fail when package.json and deno.lock disagree.
#
# It deliberately does not check the repository out. A local action is loaded from the working
# directory, so the job has to check out before it can reference this one; a checkout here would run
# too late to be the reason the action exists.

name: Setup
description: Install the pinned Deno, and install dependencies from the lockfile.

runs:
  using: composite
  steps:
    - uses: denoland/setup-deno@v2
      with:
        deno-version: ${{ env.DENO_VERSION }}
        cache: true

    - name: Install dependencies
      run: deno install --frozen
      shell: bash
