version=1.0.0
versionFilenames=
packageJSONFilename=package.json
changeLogFilename=CHANGELOG.md
ignoreInvalidCommits=false
versionTagFormat=v{version}
allowedCommitKinds=BREAKING CHANGE,build,chore,ci,docs,feat,fix,perf,refactor,revert,style,test
bumpVersionCommit=chore(release): {version}
shouldPushToOrigin=false
